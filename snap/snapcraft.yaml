summary: Hello World application for ALL360 OS

description: |
  A simple Hello World application demonstrating
  strict confinement, runtime configuration,
  configuration hooks and persistent application data
  on ALL360 OS.

apps:
  hello-all360:
    command: scripts/hello-all360

parts:
  hello-all360:
    plugin: dump
    source: .
    stage:
      - scripts/hello-all360
